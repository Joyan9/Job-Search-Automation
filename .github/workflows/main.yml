name: Daily Job Fetch

on:
  workflow_dispatch:           # Allow manual trigger from GitHub UI

jobs:
  fetch-and-score:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # Needed to commit seen_ids.json back

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          SHEET_NAME: ${{ vars.SHEET_NAME || 'Jobs' }}
          SCORE_THRESHOLD: ${{ vars.SCORE_THRESHOLD || '6.0' }}
          LOG_LEVEL: INFO
        run: python main.py

      - name: Commit updated tracking files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen_ids.json data/unmatched_jds.jsonl
          # Only commit if either file actually changed
          git diff --staged --quiet || git commit -m "chore: update tracking files [skip ci]"
          git push
