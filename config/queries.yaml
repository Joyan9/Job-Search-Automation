searches:
  - query: "marketing analyst"

  - query: "analytics engineer"

  - query: "data analyst"

  - query: "web analyst"


settings:
  results_per_query: 10
  score_threshold: 7.0
  groq_model: "meta-llama/llama-4-scout-17b-16e-instruct"  # 30K TPM vs 12K on 70b-versatile
  consensus_models:
    - "meta-llama/llama-4-scout-17b-16e-instruct"
    - "llama-3.3-70b-versatile"
  groq_temperature: 0.1
  max_description_chars: 3000
  max_job_age_days: 21
  repost_cooldown_days: 28
